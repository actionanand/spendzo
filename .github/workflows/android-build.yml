name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main-android]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BASENAME: spendzo-release

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Automatically bump Android versionCode
        if: github.ref == 'refs/heads/main-android'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/bump-android-version.js
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('./android-version.json').versionName")
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          git pull --rebase --autostash
          git add android-version.json
          if git diff --cached --quiet; then
            echo "Android version is unchanged."
          else
            git commit -m "chore: bump Android versionCode to $VERSION_CODE [skip ci]"
            git push
          fi

      - name: Read Android version
        shell: bash
        run: |
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('./android-version.json').versionName")
          VERSION_SUFFIX=${VERSION_NAME//./-}
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_FILE_BASENAME=${RELEASE_BASENAME}-${VERSION_SUFFIX}" >> "$GITHUB_ENV"
          echo "Using Android versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Angular application
        run: npm run build -- --configuration=production

      - name: Generate and synchronise Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Clear previous repository release artifacts
        shell: bash
        run: |
          mkdir -p releases
          rm -f releases/*.apk releases/*.aab releases/*.apk.idsig

      - name: Decode optional signing keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/spendzo-release.jks"; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "Signing credentials found. Signed APK and AAB files will be built."
            else
              rm -f "$RUNNER_TEMP/spendzo-release.jks"
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "Keystore decoding failed. Unsigned release files will be built."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete. Unsigned release files will be built."
          fi

      - name: Verify signing keystore
        if: steps.keystore.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: node scripts/detect-keystore-format.mjs "$RUNNER_TEMP/spendzo-release.jks"

      - name: Build release APK and AAB
        working-directory: android
        shell: bash
        env:
          HAS_KEYSTORE: ${{ steps.keystore.outputs.available }}
          KEYSTORE_PATH: ${{ runner.temp }}/spendzo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          GRADLE_ARGS=(assembleRelease bundleRelease --no-daemon)
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            GRADLE_ARGS+=(
              "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
          fi
          ./gradlew "${GRADLE_ARGS[@]}"

      - name: Copy APK and AAB to releases
        shell: bash
        env:
          HAS_KEYSTORE: ${{ steps.keystore.outputs.available }}
        run: |
          APK_SOURCE=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          AAB_SOURCE=$(find android/app/build/outputs/bundle/release -type f -name '*.aab' | head -1)
          test -s "$APK_SOURCE"
          test -s "$AAB_SOURCE"
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            APK_TARGET="releases/${RELEASE_FILE_BASENAME}.apk"
            AAB_TARGET="releases/${RELEASE_FILE_BASENAME}.aab"
          else
            APK_TARGET="releases/${RELEASE_FILE_BASENAME}-unsigned.apk"
            AAB_TARGET="releases/${RELEASE_FILE_BASENAME}-unsigned.aab"
          fi
          cp "$APK_SOURCE" "$APK_TARGET"
          cp "$AAB_SOURCE" "$AAB_TARGET"
          echo "APK_TARGET=$APK_TARGET" >> "$GITHUB_ENV"
          echo "AAB_TARGET=$AAB_TARGET" >> "$GITHUB_ENV"
          echo "Created $APK_TARGET"
          echo "Created $AAB_TARGET"

      - name: Summarize Android artifacts
        shell: bash
        run: |
          test -s "$APK_TARGET"
          test -s "$AAB_TARGET"
          {
            echo "## Android release $VERSION_NAME ($VERSION_CODE)"
            echo "- APK: \`$APK_TARGET\`"
            echo "- AAB: \`$AAB_TARGET\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh releases/

      - name: Commit versioned APK and AAB to main-android
        if: github.ref == 'refs/heads/main-android'
        shell: bash
        run: |
          test -s "$APK_TARGET"
          test -s "$AAB_TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add releases/
          if git diff --cached --quiet; then
            echo "Release files are unchanged; no release commit is needed."
          else
            git commit -m "build: add Spendzo Android $VERSION_NAME ($VERSION_CODE) [skip ci]"
            git push
            echo "APK and AAB committed to main-android/releases."
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spendzo-android-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            releases/*.apk
            releases/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.apk
            releases/*.aab
          generate_release_notes: true

      - name: Remove decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/spendzo-release.jks"
